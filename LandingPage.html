<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Site Under Construction</title>
  <style>
    :root{
      --bg1:#0f172a;
      --bg2:#0b1220;
      --accent1:#7c3aed;
      --accent2:#06b6d4;
      --card:#0b1226aa;
      --glass:rgba(255,255,255,0.06);
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial;
      background:linear-gradient(120deg,var(--bg1),var(--bg2));
      color:#e6eef8;
      display:grid;
      place-items:center;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
      padding:32px;
    }
    .frame{
      width:min(1100px,96%);
      background:linear-gradient(180deg,rgba(255,255,255,0.03),rgba(255,255,255,0.01));
      border-radius:20px;
      padding:36px;
      box-shadow:0 10px 30px rgba(2,6,23,0.6), inset 0 1px 0 rgba(255,255,255,0.02);
      display:flex;
      gap:28px;
      align-items:center;
      backdrop-filter:blur(8px) saturate(120%);
    }
    .left{
      flex:0 0 220px;
      display:flex;
      justify-content:center;
      align-items:center;
      perspective:900px;
    }
    .cube-wrap{width:160px;height:160px;transform-style:preserve-3d}
    .cube{
      width:100%;height:100%;position:relative;transform-style:preserve-3d;animation:spin 8s linear infinite;
    }
    .face{
      position:absolute;left:0;top:0;width:100%;height:100%;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:700;
      box-shadow:0 6px 18px rgba(2,6,23,0.5);
    }
    .front{transform:translateZ(80px);background:linear-gradient(135deg,var(--accent1),var(--accent2))}
    .back{transform:rotateY(180deg) translateZ(80px);background:linear-gradient(135deg,var(--accent2),var(--accent1))}
    .right{transform:rotateY(90deg) translateZ(80px);background:linear-gradient(135deg,#0ea5a4,#4f46e5)}
    .left-face{transform:rotateY(-90deg) translateZ(80px);background:linear-gradient(135deg,#f97316,#f43f5e)}
    .top{transform:rotateX(90deg) translateZ(80px);background:linear-gradient(135deg,#06b6d4,#7c3aed)}
    .bottom{transform:rotateX(-90deg) translateZ(80px);background:linear-gradient(135deg,#111827,#0f172a)}
    .badge{font-size:20px;letter-spacing:0.6px}
    @keyframes spin{from{transform:rotateX(15deg) rotateY(0deg)} to{transform:rotateX(15deg) rotateY(360deg)}}
    .right-col{flex:1;min-width:260px}
    h1{margin:0;font-size:32px;letter-spacing:-0.4px}
    p{margin:12px 0 20px;color:rgba(230,238,248,0.86);line-height:1.45}
    .meta{display:flex;gap:12px;align-items:center}
    .pill{background:var(--glass);padding:8px 12px;border-radius:999px;font-weight:600;font-size:13px}
    .progress{height:10px;width:100%;background:rgba(255,255,255,0.04);border-radius:999px;overflow:hidden}
    .progress > i{display:block;height:100%;width:48%;background:linear-gradient(90deg,var(--accent1),var(--accent2));transform-origin:left;animation:load 3.5s ease-in-out infinite alternate}
    @keyframes load{from{width:22%} to{width:78%}}
    /* spinner animation replacing progress bar */
    .spinner{width:40px;height:40px;border:4px solid rgba(255,255,255,0.3);border-top-color:var(--accent2);border-radius:50%;animation:spin2 1s linear infinite}
    @keyframes spin2{to{transform:rotate(360deg)}}
    .cta{display:inline-flex;padding:10px 14px;border-radius:10px;background:linear-gradient(90deg,rgba(255,255,255,0.04),rgba(255,255,255,0.02));align-items:center;justify-content:center;gap:10px;border:1px solid rgba(255,255,255,0.04);cursor:pointer}
    .cta.disabled{color:#fff}
    .small{font-size:13px;color:rgba(230,238,248,0.75)}
    @media (max-width:820px){
      .frame{flex-direction:column;gap:18px;padding:24px}
      .left{flex:0 0 auto}
      h1{font-size:24px}
    }
  </style>
</head>
<body>
  <main class="frame">
    <div class="left">
      <div class="cube-wrap">
        <div class="cube">
          <div class="face front"><span class="badge">🚧</span></div>
          <div class="face back"><span class="badge">🚧</span></div>
          <div class="face right"><span class="badge">🚧</span></div>
          <div class="face left-face"><span class="badge">🏗️</span></div>
          <div class="face top"><span class="badge">🚧</span></div>
          <div class="face bottom"></div>
        </div>
      </div>
    </div>
    <div class="right-col">
      <h1>Website Under Construction</h1>
      <p>I'm currently working behind the scenes to build this website. Thanks for your patience while I put the final touches together.</p>
      <div class="meta">
        <div style="flex:1">
          <div class="pill">Estimated launch: soon</div>
        </div>
        <div style="display:flex;align-items:center;justify-content:center;width:80px">
          <div class="spinner" aria-label="Loading animation"></div>
        </div>
      </div>
      <div style="margin-top:18px;display:flex;gap:12px;align-items:center">
        <div id="notifyBtn" class="cta">Notify me</div>
        <div class="small">Or check back later for updates</div>
      </div>
    </div>
  </main>
  <script>
    // change button text to tick on click
    const btn = document.getElementById('notifyBtn');
    if(btn){
      btn.addEventListener('click', () => {
        // lock current width to avoid shrinking
        const w = btn.offsetWidth;
        btn.textContent = '✓';
        btn.style.width = w + 'px';
        btn.style.cursor = 'default';
        btn.classList.add('disabled');
      });
    }
  </script>
</body>
</html>
